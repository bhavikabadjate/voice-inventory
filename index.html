<script>
const $=id=>document.getElementById(id);
const S={customers:[],khata:[],shop:{name:'',upi:''},lastSale:null,moves:[],products:[],sales:[],bill:[],pending:null,lang:'hi',editing:null};
let db=null,sample=null,dbWarned=0;
/* A write to the page's database failed: say so once in the chat and keep it in the status line. */
const dbFail=e=>{const m='Not saved: '+(e&&e.code==='quota_exceeded'?'the shop database is full':e&&e.code==='invalid_argument'?'you can view this shop but not change it':(e&&(e.message||e.code))||'unknown error');$('status').textContent=m;if(!dbWarned++)say(m+'.')};
const UL={L:'litre',kg:'kg',pc:'piece',packet:'packet'};
const fm=x=>'₹'+(Math.round(x*100)/100).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fq(q,u){q=Math.round(q*1000)/1000;
  if(u==='L'&&q<1)return Math.round(q*1000)+' ml'; if(u==='kg'&&q<1)return Math.round(q*1000)+' gram';
  return q+' '+UL[u]}

/* ---------- name normalising: Devanagari to Latin, then a sound key ---------- */
const DV={'अ':'a','आ':'a','इ':'i','ई':'i','उ':'u','ऊ':'u','ए':'e','ऐ':'ai','ओ':'o','औ':'au','ऋ':'ri',
 'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','े':'e','ै':'ai','ो':'o','ौ':'au','ृ':'ri','ॉ':'o','ॅ':'e','ऑ':'o',
 'क':'k','ख':'kh','ग':'g','घ':'gh','च':'c','छ':'ch','ज':'j','झ':'jh','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n',
 'त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l',
 'व':'v','श':'sh','ष':'sh','स':'s','ह':'h','ळ':'l','ङ':'n','ञ':'n'};
const MATRA='ािीुूेैोौृॉॅ्';
function translit(s){let o='';for(let i=0;i<s.length;i++){const c=s[i];
  if(c>='ऀ'&&c<='ॿ'){const t=DV[c];if(t===undefined)continue;o+=t;
    if(c>='क'&&c<='ह'||c==='ळ'){const n=s[i+1];if(n&&n>='\u0900'&&n<='\u097f'&&!MATRA.includes(n))o+='a'}}
  else o+=c}return o}
function key2(s){return translit(String(s).toLowerCase()).replace(/[^a-z0-9]/g,'')
  .replace(/ee/g,'i').replace(/oo/g,'u').replace(/chh|ch/g,'c').replace(/sh/g,'s').replace(/f/g,'p')
  .replace(/([bdtkgjp])h/g,'$1').replace(/w/g,'v').replace(/z/g,'j').replace(/(.)\1+/g,'$1')}
function key(s){return key2(s).replace(/a/g,'').replace(/(.)\1+/g,'$1')}
/* Word lists match on the exact sound key; the looser no-vowel key only counts for words of 3+ letters. */
const K=list=>{const s=new Set();list.split(' ').forEach(w=>{s.add(key2(w));const k=key(w);if(k.length>=3)s.add(k)});return s};
const inS=(set,t)=>set.has(t.k2)||(t.k.length>=3&&set.has(t.k));
const NUM={};[['ek one',1],['do don two',2],['teen tin three',3],['char four',4],['paanch panch pach five',5],['chhe saha six छह छे',6],
 ['saat seven',7],['aath eight',8],['nau nine',9],['das daha ten',10],['gyarah',11],['barah bara',12],['pandrah',15],['bees vees',20],
 ['pachees',25],['tees',30],['chalis',40],['pachas',50],['sau',100],['aadha adha ardha half',.5],['dedh',1.5],['dhai adich',2.5],['pav paav',.25],['sawa',1.25]]
 .forEach(([w,n])=>w.split(' ').forEach(x=>NUM[key2(x)]=n));
const UNIT={};[['litre liter litr ltr l litres lit लीटर लिटर','l'],['ml','ml'],['kg kilo kilogram kilos किलो','kg'],['gram grams gm g ग्राम','g'],
 ['piece pieces pcs pc nag','pc'],['packet packets pkt pudi पैकेट पाकीट','packet'],['dozen darjan दर्जन','dozen']]
 .forEach(([w,u])=>w.split(' ').forEach(x=>UNIT[key2(x)]=u));
const W={SELL:K('becha bech bechi beche becho bechdiya sold sell vikla vikli vikle vikale विकले विकली विकला'),STOCK:K('bacha bachi bache stock shillak left remaining urla urli स्टॉक शिल्लक'),
 ADD:K('add aaya aayi aaye jodo jod joda naya new ala aala aale aali navin'),COST:K('liya kharid kharida kharidi cost ghetla'),SELLP:K('bechna bechenge selling mrp vikaycha'),
 RATE:K('rate price bhav daam kimat'),KAR:K('kar karo kara set kardo badal badlo badla change'),BILL:K('bill'),PAKKA:K('pakka confirm final done'),
 REMOVE:K('hata hatao hatado remove kadha kadh'),EXPIRE:K('expire expiry expired'),UNDO:K('undo galat galti wapas vapas ulta mistake'),ALIAS:K('bolte kehte mhantat called'),
 KITNA:K('kitna kitne kitni kiti kitila how किती कितीला'),YES:K('haan ha yes ho hoy hoya ok okay theek thik save sahi y kara'),NO:K('nahi nako no cancel mat n nahin'),
 SEP:K('aur and ani plus'),HI:K('kitna kitne kitni kiti ka ki hai karo becha bacha bachi aur hata haan nahi ahe ko mein'),
 KHATA:K('khata khate khaate khatyat udhari udhaar udhar udhari baki baaki jama credit खाता उधार बाकी जमा'),JAMA:K('jama diye dile chukaya paid received mila mile lautaya जमा'),
 HISAB:K('hisaab hisab hishob kamai summary हिसाब हिशोब'),AAJ:K('aaj aj today आज'),BIKA:K('bika biki bik bikri sale sales kamaya बिका बिक्री'),REORDER:K('mangwana mangana mangvana mangao magvayche reorder order khatam मंगवाना मागवायचे'),
 ADVICE:K('salah salaah advice sujhav suggest suggestion tips badhaye badhayein badhaun badhana badhau improve grow सलाह सुझाव'),PROFIT:K('profit munafa kamai bikri business dhandha मुनाफा'),KAISE:K('kaise kese how कैसे'),
 MSG:K('message msg sandesh reminder offer status मैसेज संदेश'),HAFTA:K('hafte hafta week weekly saptah athavda athavdyacha हफ्ते आठवडा'),GADBAD:K('gadbad garbar gadbadi gadbadiya odd unusual audit jaanch chori गड़बड़ गडबड'),
 AVAIL:K('hai hain ahe aahe available milega milta milti rakhte have है आहे'),
 RUPEE:K('rupaye rupay rupaya rupees rupee rs रुपये रुपए'),LESS:K('kam ghatao ghata minus less kami कम'),
 KSTOP:K('likho likh likhna daalo dalo isko iska yeh ye ne kiye kiya sabse zyada jyada kiska kiski dikhao batao par pe account bill ji wale wala ab tak se liye sab sabka sabhi sare sara all yancha yanchi yanchya khatyat liha taka cha chi che madhe ahe'),
 STOP:K('ka ki ke hai hain mein me ko se liya aur and ani rs rupaye rupees rupay please the of much is what bhi item product kya total hua huwa per ek a for to in at de dena chahiye ahe che la update my mera of')};
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 2;const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}

function tokenize(text){
  let s=text.toLowerCase().replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c)).replace(/[?!।₹"']/g,' ').replace(/[,+;]/g,' , ')
    .replace(/(\d)([^\d\s.])/g,'$1 $2').replace(/([^\d\s.])(\d)/g,'$1 $2').replace(/\.(\s|$)/g,' ');
  const raw=s.split(/\s+/).filter(Boolean);
  const toks=raw.map(r=>{const k=key(r),k2=key2(r);return{raw:r,k,k2,num:/^\d+(\.\d+)?$/.test(r)?parseFloat(r):(r==='at'?undefined:NUM[k2])}});
  {const MULT={[key2('sau')]:100,[key2('hundred')]:100,[key2('shambhar')]:100,[key2('hazaar')]:1000,[key2('hajar')]:1000,[key2('thousand')]:1000};
    for(let i=0;i<toks.length-1;i++){const a=toks[i],b=toks[i+1],m=MULT[b.k2];if(a.num===undefined||!m||MULT[a.k2])continue;a.num*=m;a.raw+=' '+b.raw;toks.splice(i+1,1);
      const c=toks[i+1];if(c&&c.num!==undefined&&c.num<m&&c.num>=1&&!/^\d/.test(c.raw)&&!MULT[c.k2]){a.num+=c.num;toks.splice(i+1,1)}i--}}
  toks.forEach((t,i)=>{const p=toks[i-1];
    if(t.k2==='do'&&p&&(inS(W.KAR,p)||inS(W.REMOVE,p)||inS(W.KSTOP,p)||inS(W.SELL,p)||p.k2==='de'||p.k2==='dal'))t.num=undefined;
    t.unit=t.num===undefined?UNIT[t.k2]:undefined;t.sep=t.raw===','||inS(W.SEP,t)});
  return toks}

function nameIndex(){const m=new Map();for(const p of S.products)for(const n of [p.name,...(p.names||[])]){const k=key(n);if(!k)continue;
  if(!m.has(k))m.set(k,[]);m.get(k).push({id:p.id,k2:key2(n)})}return m}
/* Finds products, quantities and units in a sentence. */
/* Words of every product name, so "potato chips" can find "Maxvita Potato Chips" and "Balaji Potato Chips". */

function cloudSave(p,old,reason){const sid=store.id;
  const unit=(p.runit&&!R2U[p.runit]&&p.unit==='pc')?p.runit:U2R[p.unit];
  const row={id:p.id,store_id:sid,names:[p.name,...(p.names||[])],unit,sell_paise:Math.round(p.sell*100),expiry:p.expiry||null,low_stock_at:p.low||null,deleted:false};if(S.hasBatchCol)row.batches=p.batches;
  if(!old)outbox({t:'product',row});
  else{   /* Send only what this change touched, so a phone that has not synced lately cannot undo the owner's new price or bring back a deleted product. */
    const was={names:[old.name,...(old.names||[])],unit:(old.runit&&!R2U[old.runit]&&old.unit==='pc')?old.runit:U2R[old.unit],sell_paise:Math.round(old.sell*100),expiry:old.expiry||null,low_stock_at:old.low||null,batches:old.batches},patch={};
    for(const k of (reason==='sale'||reason==='restock'?['expiry','batches']:['names','unit','sell_paise','expiry','low_stock_at','batches']))if(k in row&&JSON.stringify(row[k])!==JSON.stringify(was[k]))patch[k]=row[k];
    if(Object.keys(patch).length)outbox({t:'pupd',id:p.id,patch})}
  if(p.cost!=null&&canCost()&&(!old||old.cost!==p.cost))outbox({t:'cost',row:{product_id:p.id,store_id:sid,cost_paise:Math.round(p.cost*100)}});
  const delta=Math.round((p.qty-(old?old.qty:0))*1000)/1000;
  if(delta)outbox({t:'move',row:{id:nid('m'),store_id:sid,product_id:p.id,delta,reason:old?reason:'create',created_at:new Date().toISOString()}})}
async function allRows(table,cols,since){let out=[],from=0;for(;;){let q=sb.from(table).select(cols).eq('store_id',store.id);if(since)q=q.gte(since[0],since[1]);const d=ck(await q.order(table==='product_costs'?'product_id':'id').range(from,from+999));out=out.concat(d);if(d.length<1000)break;from+=1000}return out}
async function pull(){if(!store||!session||OB.length)return;
  const [ps,cs,ms,ss,cu,kh]=await Promise.all([allRows('products','*'),allRows('product_costs','product_id,cost_paise').catch(e=>{if(transient(e))throw e;return[]}),allRows('stock_moves','id,product_id,delta,reason,created_at'),allRows('sales','id,bill_id,product_id,qty,sell_paise,amount_paise,sold_at',['synced_at',new Date(Date.now()-90*864e5).toISOString()])   /* by the server's clock, so a phone with the wrong date cannot hide its sales */,allRows('customers','id,name,phone,deleted').catch(e=>{if(transient(e))throw e;return null}),allRows('khata_entries','id,customer_id,amount_paise,note,created_at').catch(e=>{if(transient(e))throw e;return null})]);
  if(OB.length)return;
  if(!cu||!kh){S.khataCloud=false;if($('shopMsg')&&S.khata.length)$('shopMsg').textContent=KHATA_LOCAL()}   /* cloud khata unreadable: leave the phone's khata exactly as it is */
  else{S.khataCloud=true;const cid=new Set(cu.map(c=>c.id)),kid=new Set(kh.map(k=>k.id)),mineC=S.customers.filter(c=>c.u),mineK=S.khata.filter(e=>e.u&&!kid.has(e.id));
    /* cloud rows, plus anything made on this phone that has not been sent yet */
    S.customers=[...cu.filter(c=>!c.deleted).map(c=>mineC.find(x=>x.id===c.id)||{id:c.id,name:c.name,phone:c.phone||''}),...mineC.filter(c=>!cid.has(c.id))];
    S.khata=[...kh.map(k=>({id:k.id,cid:k.customer_id,amount:k.amount_paise/100,note:k.note||'',at:+new Date(k.created_at)})),...mineK].sort((a,b)=>b.at-a.at);
    if(mineC.length||mineK.length)setTimeout(khataPush,0)}
  const q={},cost={},byId={};ms.forEach(m=>q[m.product_id]=(q[m.product_id]||0)+m.delta);cs.forEach(c=>cost[c.product_id]=c.cost_paise/100);
  const conv=p=>({id:p.id,name:(p.names&&p.names[0])||'?',names:(p.names||[]).slice(1),unit:R2U[p.unit]||'pc',runit:p.unit,sell:p.sell_paise/100,cost:cost[p.id]??null,qty:Math.round((q[p.id]||0)*1000)/1000,low:p.low_stock_at||0,expiry:p.expiry||'',batches:Array.isArray(p.batches)?p.batches:undefined});
  if(ps.length)S.hasBatchCol='batches' in ps[0];
  ps.forEach(p=>{const c=conv(p);c.batches=bFit(bOf(c),c.qty);c.expiry=(c.batches.find(b=>b.exp)||{exp:''}).exp;byId[p.id]=c});
  S.moves=ms.map(m=>({pid:m.product_id,name:(byId[m.product_id]||{name:'?'}).name,unit:(byId[m.product_id]||{unit:'pc'}).unit,delta:m.delta,reason:m.reason,at:+new Date(m.created_at)})).sort((a,b)=>b.at-a.at).slice(0,300);S.products=ps.filter(p=>!p.deleted).map(p=>byId[p.id]);
  const bills=new Map();ss.forEach(r=>{const b=bills.get(r.bill_id)||{items:[],paise:0,at:+new Date(r.sold_at)};const pr=byId[r.product_id]||{name:'?',unit:'pc'};
    b.items.push({name:pr.name,qty:r.qty,unit:pr.unit,rate:r.sell_paise/100,amount:r.amount_paise/100});b.paise+=r.amount_paise;bills.set(r.bill_id,b)});
  S.sales=[...bills.values()].map(b=>({items:b.items,total:Math.round(b.paise/100),at:b.at})).sort((a,b)=>b.at-a.at);renderAll();persist()}
/* The phone keeps a copy of the signed-in shop. Opening from it means the shop works at once, and with no internet. */
function bootCache(){try{const c=JSON.parse(localStorage.getItem('cloudcache')||'null');if(c&&c.store&&c.member){store=c.store;member=c.member;restore(c);S.seeded=1;return true}}catch(e){}return false}
/* Stop being in a shop on this phone, and show the phone's own data again. */
function leaveShop(){store=null;member=null;S.needAuth=false;S.seeded=0;S.hasBatchCol=undefined;S.khataCloud=undefined;OB=[];saveOB();try{localStorage.removeItem('cloudcache')}catch(e){}
  let d=null;try{d=JSON.parse(localStorage.getItem('shop')||'null')}catch(e){}restore(d||{});renderAll()}
async function findStore(){const had=store;let r;try{r=await sb.auth.getSession()}catch(e){r={data:{session:null},error:e}}session=r.data.session;
  const ready=()=>{$('costOn').closest('label').hidden=!canCost();if(!canCost()){$('costOn').checked=false}renderInfo()};
  if(!session){if(!had)return;ready();
    if((r.error&&transient(r.error))||navigator.onLine===false)$('status').textContent=OB.length?`Offline: ${OB.length} waiting to sync`:'Offline';else lostAuth();return}
  try{const all=ck(await sb.from('members').select(MEMBER).eq('user_id',session.user.id).limit(20)),ms=had?all.filter(m=>m.store_id===had.id):all;
    if(!ms.length){
      if(had&&waiting())return await notMember();   /* a different account while changes are waiting: keep the shop and the queue */
      if(had)leaveShop();if(!all.length)return;ms.push(all[0])}
    const st=ck(await sb.from('stores').select('id,name,code,upi_id').eq('id',ms[0].store_id).single());member=ms[0];store=st;S.needAuth=false;S.shop={name:store.name||'',upi:store.upi_id||''};
    /* khata that only this phone holds lives in its saved copy of the shop; start from that, then merge with the cloud */
    try{const c=JSON.parse(localStorage.getItem('cloudcache')||'null');if(c&&c.store&&c.store.id===store.id&&!S.seeded){S.customers=c.customers||[];S.khata=c.khata||[];S.seeded=1}}catch(e){}
    adoptLocal()}
  catch(e){if(!transient(e))throw e;if(!store&&!bootCache())throw e;renderAll();$('status').textContent='Offline'}
  if(store){await probeBatches();importPending()}   /* queue the new shop's products at once, even if the connection has just dropped */
  ready();await enqueue(sync)}
function loadScript(src){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=()=>no(new Error('could not load '+src));document.head.append(e)})}
async function cloudInit(){await loadScript('supabase.js');
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  /* Every 20 seconds while the app is on screen: always send what is waiting; also fetch, unless a form or a question asked in the last 90 seconds is open. Never stack up behind a slow sync. */
  setInterval(tick,20000);window.addEventListener('online',()=>{if(store)enqueue(sync)});
  try{await findStore()}finally{renderShop()}}

function importPending(){let d=null;try{d=JSON.parse(localStorage.getItem('import')||'null')}catch(e){}

  for(let i=0;i<rows.length;i+=400)outbox({t:'sales',rows:rows.slice(i,i+400)});

/* When the built-in rules do not understand a sentence, Claude rewrites it into one they do.
   Inside Claude the page asks directly; on the hosted site it goes through the shop's backend function. */
const AI_FORMS='price <qty> <unit> <Product> [and <qty> <unit> <Product> ...]\nsold <qty> <unit> <Product>\nstock <Product>\nrate <Product> <number> set\nadd <Product> <qty> <unit>\nexpiry\nundo';
async function aiRewrite(text){const names=S.products.map(p=>p.name+((p.names||[]).length?' (also: '+p.names.slice(0,4).join(', ')+')':''));let line='';
  try{
    if(sample){const r=await sample(`A shopkeeper said (Hindi/Marathi/English, maybe misheard): "${text}"\nShop products: ${names.join(', ')}\nThe text came from speech recognition and may be misheard: match by sound, e.g. 'dosa gram zero' for a shop that has Jeera means '200 gram Jeera' (do sau = 200). Rewrite it as ONE line in exactly one of these forms, using the main product name (before any 'also:') exactly as listed:\n${AI_FORMS}\nIf nothing fits reply: unknown\nReply with the line only.`,{modelTier:'quick'});line=r.text||''}
    else if(sb&&session&&store){const {data,error}=await sb.functions.invoke('understand',{body:{text,products:names}});if(error)throw error;line=(data&&data.line)||''}
  }catch(e){return null}
  line=line.trim().split('\n')[0];return line&&!/^unknown/i.test(line)?line:null}

function hisaab(per){const D=864e5,yd=new Date(Date.now()-D).toDateString(),lab=per==='y'?['काल','Kal','Yesterday']:per==='m'?['गेल्या 30 दिवसांत','Pichhle 30 din mein','Last 30 days']:null;
  const relabel=x=>lab?x.replace(/^आज अजून|^आज/,lab[0]).replace(/^Aaj abhi tak|^Aaj/,lab[1]).replace(/^No sales yet today/,'No sales: '+lab[2]).replace(/^Today/,lab[2]):x;
  const ss=per==='y'?S.sales.filter(x=>new Date(x.at).toDateString()===yd):per==='m'?S.sales.filter(x=>x.at>Date.now()-30*D):todaySales(),tot=ss.reduce((a,s)=>a+s.total,0),bills=ss.filter(s=>s.total>0).length-ss.filter(s=>s.total<0).length,agg={};let profit=0,known=true;
  ss.forEach(s=>s.items.forEach(i=>{const g=agg[i.name]=agg[i.name]||{amt:0};g.amt+=i.amount;const p=S.products.find(x=>x.name===i.name);if(p&&p.cost!=null)profit+=(i.rate-p.cost)*i.qty;else known=false}));
  const top=Object.entries(agg).filter(x=>x[1].amt>0).sort((a,b)=>b[1].amt-a[1].amt).slice(0,3).map(([n,g])=>`${n} ${fm(g.amt)}`).join(', ');
  const owed=S.customers.reduce((a,c)=>a+Math.max(balance(c.id),0),0);
  if(!ss.length)return say(relabel(tm('आज अजून विक्री झाली नाही.','Aaj abhi tak koi bikri nahi hui.','No sales yet today.'))+(owed?tm(` एकूण उधारी बाकी ${fm(owed)}.`,` Kul udhaar baki ${fm(owed)}.`,` Total credit owed ${fm(owed)}.`):''));
  const sp=relabel(tm(`आज ${fm(tot)} ची विक्री, ${bills} बिले.`,`Aaj ${fm(tot)} bika, ${bills} bill.`,`Today: ${fm(tot)} in ${bills} bills.`))+(top?tm(` सर्वात जास्त: ${top}.`,` Sabse zyada: ${top}.`,` Top items: ${top}.`):'')+(owed?tm(` एकूण उधारी बाकी ${fm(owed)}.`,` Kul udhaar baki ${fm(owed)}.`,` Total credit owed ${fm(owed)}.`):'');
  say(sp+(canCost()&&!$('costOn').checked&&per==='p'?'\n'+t('Munafa dekhne ke liye upar Cost chalu karo.','Turn on Cost at the top to see profit.'):'')+(canCost()&&$('costOn').checked?'\n'+t(`Munafa${known?'':' (jin cheezon ka kharid rate pata hai)'}: ${fm(profit)}`,`Profit${known?'':' (items with a known cost)'}: ${fm(profit)}`):''),null,sp)}
/* How much to order: enough for a week at the recent selling speed, rounded to a sensible pack size. */
function reorderPlan(){const now=Date.now(),D=864e5,first=S.sales.length?Math.min(...S.sales.map(x=>x.at)):now,days=Math.max(1,Math.min(14,Math.ceil((now-first)/D))),sold={};
  S.sales.filter(x=>x.at>now-14*D).forEach(x=>x.items.forEach(i=>sold[i.name]=(sold[i.name]||0)+i.qty));
  const up=(q,u)=>u==='kg'||u==='L'?(q<=5?Math.ceil(q):q<=20?Math.ceil(q/5)*5:Math.ceil(q/10)*10):(q<=12?Math.ceil(q):Math.ceil(q/6)*6);
  return S.products.map(p=>{const rate=(sold[p.name]||0)/days,need=rate*7-p.qty,isLow=(p.low>0&&p.qty<=p.low)||p.qty<=0;if(!(need>0)&&!isLow)return null;
    const want=need>0?need:Math.max(p.low*2-p.qty,p.low||1);return{p,rate,order:up(want,p.unit),daysLeft:rate>0?Math.floor(p.qty/rate):null}}).filter(Boolean).sort((a,b)=>(a.daysLeft??99)-(b.daysLeft??99))}

  say(tm('हे मागवायचे आहे:\n','Yeh mangwana hai:\n','To reorder:\n')+lines.join('\n')+(S.sales.length?t('\n(1 hafte ki bikri ke hisaab se)','\n(based on about a week of sales)'):''),[[tm('WhatsApp वर पाठवा','WhatsApp par bhejo','Send on WhatsApp'),'https://wa.me/?text='+encodeURIComponent(S.lastMsg),1],[t('Copy karo','Copy'),'#copy']])}

  const pool=S.products.filter(p=>p.sell>0),fast=pool.filter(p=>/milk|bread|eggs|sugar|parle|onion|potato|tea|maggi/i.test(p.name));
  for(let d=13;d>=0&&pool.length;d--)for(let i=rnd(3,7);i>0;i--){const at=now-d*D-rnd(0,10)*36e5-rnd(0,59)*6e4;if(at>now)continue;const seen=new Set(),items=[];
      for(let k=rnd(1,4);k>0;k--){const p=Math.random()<.7&&fast.length?pick(fast):pick(pool);if(seen.has(p.id))continue;seen.add(p.id);
        const q=p.unit==='kg'||p.unit==='L'?pick([.25,.5,1,1,2]):rnd(1,4);items.push({name:p.name,qty:q,unit:p.unit,rate:p.sell,amount:Math.round(q*p.sell*100)/100})}
      const sale={items,total:Math.round(items.reduce((a,x)=>a+x.amount,0)),at};S.sales.push(sale);nb++;if(db)db.collection('sales').add(sale).catch(()=>{})}
  S.sales.sort((a,b)=>b.at-a.at);
  [['Ramesh Patil',[[450,9],[-200,4],[180,1]]],['Sunita Joshi',[[1200,12],[-500,6]]],['Imran Shaikh',[[320,3]]],['Lata Kulkarni',[[90,7],[-90,2]]]].forEach(([n,es])=>{if(findCustomer(n))return;const c=addCustomer(n);
    es.forEach(([amt,ago])=>{const e={id:nid('k'),cid:c.id,amount:amt,note:'',at:now-ago*D};S.khata.push(e);if(db)db.collection('khata').doc(e.id).set({cid:e.cid,amount:amt,note:'',at:e.at}).catch(()=>{})})});
  S.khata.sort((a,b)=>b.at-a.at);S.undo=null;persist();renderAll();return{np,nb}}

 product_photo:`The image shows a packaged grocery product. Read the pack and return ONLY JSON: {"name":"<brand and product, e.g. Tata Salt>","size":"<e.g. 1 kg, 500 ml, or empty>","unit":"packet|pc|kg|L","mrp":<number or null>,"other_names":["up to 4 common Hindi, Marathi or English names for this kind of item"]}. Use only what is printed or obvious; null or empty when it is not visible. If no product is visible return {"name":""}.`,

 weekly:`Write a plain-language weekly summary for a kirana shop owner from the JSON, which holds their own numbers. 5 to 7 short lines: sales against last week, best sellers, what to reorder, what is not selling, credit owed, and anything listed under "odd". Use only numbers that are in the JSON. Language as given. Plain text, no markdown.`,
 unit:`An Indian kirana shop sells the item named in the JSON. Reply with exactly one word for the unit it is normally sold in: kg, L, pc or packet. Loose goods by weight are kg, loose liquids are L, single countable things are pc, branded sealed packs are packet.`,

/* Which unit a product is normally sold in: built-in knowledge first, then Claude. */
function guessUnitLocal(name){const k=key2(name),ref=SAMPLES.find(x=>[x[0],...x[1]].some(n=>key2(n)===k));if(ref)return ref[2];
  const g=NAME_GROUPS.find(g=>g.some(n=>key2(n)===k));if(g)return /coconut|lemon|toothpaste|matchbox/i.test(g[0])?'pc':/coffee/i.test(g[0])?'packet':'kg';
  const n=translit(String(name).toLowerCase());
  if(/oil|tel\b|milk|dudh|doodh|juice|phenyl|liquid|sharbat|vinegar|sirka|kerosene|lassi|chaas|tak\b/.test(n))return'L';
  if(/soap|sabun|egg|anda|pen\b|pencil|brush|blade|razor|battery|bulb|candle|mombatti|coconut|nariyal|lemon|nimbu|comb|lighter/.test(n))return'pc';

  if(/dal\b|daal|rice|chawal|atta|flour|sugar|cheeni|salt|namak|rava|suji|poha|besan|maida|onion|potato|aloo|pyaaz|tomato|sabzi|mirch|haldi|jeera|dhaniya|gud|jaggery|chana|rajma|moong|peanut|ghee|paneer|dahi|curd|butter|fruit|kela|apple/.test(n))return'kg';

async function guessUnit(name){const l=guessUnitLocal(name);if(l)return l;const r=(await ai('unit',{name})||'').trim().toLowerCase().replace(/[^a-z]/g,'');return{kg:'kg',l:'L',litre:'L',pc:'pc',piece:'pc',packet:'packet'}[r]||null}

/* Things that do not add up, from the stock log, sales and khata. */

  S.moves.filter(m=>m.reason==='set'&&m.delta<0&&!m.undo&&m.at>now-30*D).forEach(m=>{const g=loss[m.name]=loss[m.name]||{q:0,unit:m.unit,n:0};g.q+=-m.delta;g.n++});
  Object.entries(loss).sort((a,b)=>b[1].q-a[1].q).slice(0,4).forEach(([n,g])=>{const p=S.products.find(x=>x.name===n);out.push(t(`${n}: stock ${g.n} baar sudhaar kar ${fq(g.q,g.unit)} kam kiya gaya, bina bikri ke${p?` (lagbhag ${fm(g.q*p.sell)} ka maal)`:''}.`,`${n}: stock was corrected down ${g.n} time(s) by ${fq(g.q,g.unit)} with no sale${p?` (about ${fm(g.q*p.sell)} of goods)`:''}.`))});
  const und=S.sales.filter(x=>x.total<0&&x.at>now-7*D).length;if(und>=3)out.push(t(`Is hafte ${und} bikri wapas ki gayi.`,`${und} sales were undone this week.`));
  S.products.forEach(p=>{const ch=(p.history||[]).filter(h=>h.at>now-7*D).length;if(ch>=3)out.push(t(`${p.name} ka rate is hafte ${ch} baar badla.`,`${p.name}'s price changed ${ch} times this week.`))});
  S.products.filter(p=>p.cost!=null&&p.sell<p.cost).slice(0,3).forEach(p=>out.push(t(`${p.name} kharid se kam rate par bik raha hai.`,`${p.name} is selling below its cost price.`)));
  S.customers.forEach(c=>{const es=S.khata.filter(e=>e.cid===c.id),b=balance(c.id);if(b<=0||!es.length)return;const lastPay=Math.max(0,...es.filter(e=>e.amount<0).map(e=>e.at)),first=Math.min(...es.map(e=>e.at));
    if(now-Math.max(lastPay,first)>30*D)out.push(t(`${c.name} ne 30 din se kuch jama nahi kiya, ${fm(b)} baki.`,`${c.name} has paid nothing for 30 days and owes ${fm(b)}.`))});
  return out}

/* ---------- business advice from the shop's own numbers ---------- */
function shopFacts(){const now=Date.now(),D=864e5,cost=canCost(),r=x=>Math.round(x*100)/100;
  const win=(a,b)=>S.sales.filter(s=>s.at>now-a*D&&s.at<=now-b*D),sum=l=>r(l.reduce((x,s)=>x+s.total,0));
  const w1=win(7,0),w0=win(14,7),first=S.sales.length?Math.min(...S.sales.map(s=>s.at)):now,agg={};
  win(30,0).forEach(s=>s.items.forEach(i=>{const g=agg[i.name]=agg[i.name]||{q7:0,rev7:0,q30:0};g.q30+=i.qty;if(s.at>now-7*D){g.q7+=i.qty;g.rev7+=i.amount}}));
  const items=S.products.map(p=>{const g=agg[p.name]||{q7:0,rev7:0,q30:0},o={name:p.name,unit:UL[p.unit],price:p.sell,stock:p.qty,sold7d:r(g.q7),revenue7d:r(g.rev7),sold30d:r(g.q30)};
    if(g.q7>0)o.daysOfStockLeft=Math.round(p.qty/(g.q7/7));if(p.low)o.lowLevel=p.low;if(p.expiry)o.expiresInDays=daysTo(p.expiry);
    if(cost&&p.cost!=null){o.cost=p.cost;o.marginPct=p.sell?Math.round((p.sell-p.cost)/p.sell*100):0;o.profit7d=r((p.sell-p.cost)*g.q7)}return o});
  return{shop:S.shop.name||'',daysOfSalesHistory:Math.max(0,Math.round((now-first)/D)),hasCostData:cost,
    last7days:{sales:sum(w1),bills:w1.filter(s=>s.total>0).length},previous7days:{sales:sum(w0),bills:w0.filter(s=>s.total>0).length},today:{sales:sum(todaySales())},
    products:items.sort((a,b)=>b.revenue7d-a.revenue7d).slice(0,60),
    creditOwed:{total:r(S.customers.reduce((a,c)=>a+Math.max(balance(c.id),0),0)),top:S.customers.map(c=>({name:c.name,owes:balance(c.id)})).filter(x=>x.owes>0).sort((a,b)=>b.owes-a.owes).slice(0,5)}}}

    for(const w of want){v=voices.find(x=>x.lang.toLowerCase().replace('_','-').startsWith(w));if(v)break}

    if(v){u.voice=v;u.lang=v.lang}else u.lang='en-IN';

    u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')st.textContent='Sound is blocked here ('+e.error+'). Open the page in its own browser tab and check the phone is not on silent.'};

   `<h2 id="gTitle">${tm('सुरू करूया','Shuru karein','Ready to start')}</h2><p>${tm('“दुकान” टॅबमध्ये दुकानाचे नाव आणि UPI ID टाका, म्हणजे प्रत्येक बिलासोबत QR दिसेल.','“Dukaan” tab mein dukaan ka naam aur UPI ID daalo, to har bill ke saath QR dikhega.','Add your shop name and UPI ID in the Shop tab so every bill shows a payment QR.')}</p><div class="gstart">${store||S.products.length>3?'':`<button type="button" class="btn" id="gSample">${tm('नमुना डेटासह पाहा','Namoona data ke saath aazmao','Try it with example data')}</button>`}<button type="button" class="btn go" id="gGo">${tm('माझ्या दुकानापासून सुरू करा','Apni dukaan se shuru karo','Start with my own shop')}</button></div>`][gStep];
  $('gDots').innerHTML=[0,1,2,3].map(i=>`<i class="${i===gStep?'on':''}"></i>`).join('');$('gNav').hidden=last;$('gSkip').textContent=tm('वगळा','Chhodo','Skip');$('gNext').textContent=tm('पुढे','Aage','Next');
  b.querySelectorAll('[data-l]').forEach(x=>x.onclick=()=>{setLang(x.dataset.l,true);greet();renderGuide()});
  if($('gSample'))$('gSample').onclick=()=>{loadSamples();closeGuide()};if($('gGo'))$('gGo').onclick=closeGuide}
function openGuide(){gStep=0;$('guide').hidden=false;renderGuide()}
function closeGuide(){$('guide').hidden=true;try{localStorage.setItem('guided','1')}catch(e){}}
/* The language switch sets what the mic listens for, the reply language and the voice. */
function setLang(l,quiet){S.lang=l;try{localStorage.setItem('lang',l)}catch(e){}
  $('lang-hi').setAttribute('aria-pressed',l==='hi');$('lang-mr').setAttribute('aria-pressed',l==='mr');$('lang-en').setAttribute('aria-pressed',l==='en');
  $('micLabel').textContent=tm('दाबा आणि बोला','Tap karke bolo','Tap and speak');$('voiceAddT').textContent=tm('बोलून जोडा','Bolkar add karo','Add by voice');$('newBtn').textContent=tm('लिहून जोडा','Likhkar add karo','Add by typing');$('say').placeholder=mode==='sales'?tm('किंवा लिहा: 2 किलो साखर, 1 Parle-G','Ya likho: 2 kilo cheeni, 1 Parle-G','Or type: 2 kg sugar, 1 Parle-G'):tm('किंवा इथे लिहा: 2 लिटर दूध कितीला?','Ya yahan likho: 2 litre dudh kitne ka hai?','Or type here: price of 2 litre milk');
  $('billEmpty').textContent=tm('बिल रिकामे आहे. माइक दाबा आणि बोला: “2 किलो साखर, 1 पॅकेट Parle-G”, किंवा खालून वस्तू निवडा.','Bill khali hai. Mic dabao aur bolo: “2 kilo cheeni, 1 packet Parle-G”, ya neeche se item chuno.','The bill is empty. Tap the mic and say “2 kg sugar, 1 packet Parle-G”, or pick items below.');
  applyLabels();renderAll();renderBill();if(sb&&!$('shopBox').hidden)renderShop();
  if(listening&&rec){try{rec.abort()}catch(e){}}if(!quiet)greet()}
$('lang-hi').onclick=()=>setLang('hi');$('lang-mr').onclick=()=>setLang('mr');$('lang-en').onclick=()=>setLang('en');
let L0='hi';try{L0=localStorage.getItem('lang')||'hi'}catch(e){}
setLang(L0,true);greet();
try{if(localStorage.getItem('guided')!=='1'){localStorage.setItem('guide-check','1');openGuide()}}catch(e){}
(async()=>{const c=window.claude;
  try{db=c?await c.use('db'):null}catch(e){db=null}
  try{sample=c?await c.use('sample'):null}catch(e){sample=null}
  if(!db){let ok=false;try{const d=JSON.parse(localStorage.getItem('shop')||'null');if(d)restore(d);else if(window.SEED)S.products=window.SEED;localStorage.setItem('shop-ok','1');ok=true}catch(e){}
    renderAll();$('status').textContent=ok?'Saved on this device':'Changes are not saved in this browser';
    if(location.protocol.startsWith('http')&&!c){$('shopBox').hidden=false;
      if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});   /* lets the page open with no internet */
      if(bootCache()){renderAll();$('status').textContent=OB.length?`Offline: ${OB.length} waiting to sync`:'Offline'}renderShop();
      cloudInit().catch(e=>{$('shopMsg').textContent='Cloud is not reachable: '+(e.message||e)}).finally(()=>{window.__booted=1})}
    return}
  $('status').textContent='Saved to your shop';
  const fail=e=>{$('status').textContent='Offline: '+(e.message||e.code)};
  db.collection('products').limit(1000).onSnapshot(s=>{S.products=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},fail);
  db.collection('moves').orderBy('at','desc').limit(200).onSnapshot(s=>{S.moves=s.docs.map(d=>d.data());renderMoves()},()=>{});
  db.collection('customers').limit(1000).onSnapshot(s=>{S.customers=s.docs.map(d=>({id:d.id,...d.data()}));renderKhata()},()=>{});
  /* newest 1000 live; anything older is read once in pages, so balances count every entry */
  let olderK=[],olderFor=null;
  db.collection('khata').orderBy('at','desc').limit(1000).onSnapshot(async s=>{const live=s.docs.map(d=>({id:d.id,...d.data()})),have=new Set(live.map(e=>e.id));S.khata=live.concat(olderK.filter(e=>!have.has(e.id)));renderKhata();
    if(live.length<1000||olderFor!==null)return;olderFor=live[live.length-1].at;
    try{let cut=olderFor,got=[];for(let i=0;i<30;i++){const q=await db.collection('khata').where('at','<=',cut).orderBy('at','desc').limit(1000).get(),rows=q.docs.map(d=>({id:d.id,...d.data()}));got=got.concat(rows);if(rows.length<1000)break;const next=rows[rows.length-1].at;cut=next<cut?next:cut-1}
      const seen=new Set();olderK=got.filter(e=>!seen.has(e.id)&&seen.add(e.id));const h2=new Set(S.khata.map(e=>e.id));S.khata=S.khata.concat(olderK.filter(e=>!h2.has(e.id)));renderKhata()}catch(e){olderFor=null}},()=>{});
  db.doc('meta/shop').onSnapshot(d=>{if(d.exists){S.shop={name:'',upi:'',...d.data()};renderInfo()}},()=>{});
  db.collection('sales').orderBy('at','desc').limit(1000).onSnapshot(s=>{S.sales=s.docs.map(d=>d.data());renderSales()},fail);
})();
</script>
