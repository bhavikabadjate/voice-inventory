function lev(a,b){if(Math.abs(a.length-b.length)>1)return 2;const d=[...Array(b.length+1).keys()];

function tokenize(text){

  const toks=raw.map(r=>{const k=key(r),k2=key2(r);return{raw:r,k,k2,num:/^\d+(\.\d+)?$/.test(r)?parseFloat(r):(r==='at'?undefined:NUM[k2])}});

    if(t.k2==='do'&&p&&(inS(W.KAR,p)||inS(W.REMOVE,p)||p.k2==='de'))t.num=undefined;
    t.unit=t.num===undefined?UNIT[t.k2]:undefined;t.sep=t.raw===','||inS(W.SEP,t)});

function parseItems(toks){const idx=nameIndex(),items=[],used=new Set();let amb=null,cur={p:null,qty:null,unit:null};
  const flush=()=>{if(cur.p)items.push(cur);else if(cur.qty!=null&&items.length&&items[items.length-1].qty==null){const l=items[items.length-1];l.qty=cur.qty;l.unit=cur.unit}
    else if(cur.qty!=null)items.loose=cur;cur={p:null,qty:null,unit:null}};
  for(let i=0;i<toks.length;i++){const t=toks[i];
    if(t.sep){flush();continue}
    if(t.num!==undefined){if(cur.p&&cur.qty!=null)flush();if(cur.qty==null)cur.qty=t.num;used.add(i);continue}
    if(t.unit){if(!cur.unit)cur.unit=t.unit;used.add(i);continue}
    let hit=null,n=0;
    for(n=3;n>=1&&!hit;n--){if(i+n>toks.length)continue;const sl=toks.slice(i,i+n),k=sl.map(x=>x.k).join(''),k2=sl.map(x=>x.k2).join('');
      const m=(idx.get(k)||[]).filter(e=>k.length>=3||e.k2===k2);if(m.length){hit=new Set(m.map(e=>e.id));break}}
    if(!hit&&t.k.length>=4&&!Object.values(W).some(s=>inS(s,t))){for(const [k,es] of idx)if(k.length>=4&&lev(k,t.k)<=1){hit=new Set(es.map(e=>e.id));n=1;break}}
    if(hit){if(hit.size>1){if(S.prefer&&hit.has(S.prefer))hit=new Set([S.prefer]);else amb=[...hit]}
      if(cur.p)flush();cur.p=S.products.find(p=>p.id===[...hit][0]);for(let j=i;j<i+n;j++)used.add(j);i+=n-1}}

  if(has(W.RATE)&&has(W.KAR)&&items.length===1&&items[0].qty!=null){const p=items[0].p,v=items[0].qty;
    const odd=p.sell>0&&(v>p.sell*3||v<p.sell/3)?t('Yeh bahut bada badlav hai. ','That is a very big change. '):'';
    return confirmAsk(odd+t(`${p.name} ka rate ${fm(p.sell)} se ${fm(v)} karun?`,`Change ${p.name} from ${fm(p.sell)} to ${fm(v)}?`),()=>{saveProduct({...p,sell:v,history:[...(p.history||[]),{from:p.sell,to:v,at:Date.now()}]});say(t(`${p.name} ab ${fm(v)} per ${UL[p.unit]}.`,`${p.name} is now ${fm(v)} per ${UL[p.unit]}.`))})}
  if(has(W.SELL)&&items.length){const lines=linesOf(items);if(!lines)return;const tot=Math.round(lines.reduce((a,l)=>a+l.amount,0));
    const sh=short(lines),w=sh?t(`Dhyan do: ${sh}. `,`Careful: ${sh}. `):'';
    return confirmAsk(w+t(`${lines.map(l=>fq(l.qty,l.unit)+' '+l.name).join(', ')} becha, ${fm(tot)}. Save karun?`,`Sold ${lines.map(l=>fq(l.qty,l.unit)+' '+l.name).join(', ')} for ${fm(tot)}. Save it?`),()=>{recordSale(lines);say(t('Sale save ho gayi, stock kam kar diya.','Sale saved and stock lowered.'))})}
  if(has(W.STOCK)&&items.length){const it=items[0],p=it.p;
    if(it.qty!=null&&!has(W.KITNA)){const q=toBase(it.qty,it.unit,p);if(q!=null)return confirmAsk(t(`${p.name} ka stock ${fq(q,p.unit)} set karun?`,`Set ${p.name} stock to ${fq(q,p.unit)}?`),()=>{saveProduct({...p,qty:q});say(t('Stock theek kar diya.','Stock corrected.'))})}
    return say(items.map(i=>`${i.p.name}: ${fq(i.p.qty,i.p.unit)} ${t('bacha hai','left')}`).join('\n'))}
  if(!items.length&&has(W.STOCK))return say(t('Kis cheez ka stock? Aise bolo: "sugar ka stock 25 kilo hai" ya "10 litre milk aaya".','Stock of what? Say "set sugar stock to 25 kg" or "add 10 litre milk".'));
  if(!items.length){
    if(!fromAI&&S.products.length){const line=await aiRewrite(text);if(line){const l=S.lang;await handle(line.replace(/^price\s+/i,''),true);S.lang=l;return}}
    return say(t('Samajh nahi aaya. Aise bolo: "2 litre dudh kitne ka hai?", "cheeni add karo", "1 kilo sugar becha".','I did not catch that. Try: "price of 2 litre milk", "add sugar", "sold 1 kg sugar".'))}
  const lines=linesOf(items);if(!lines)return;
  if(lines.length===1){const l=lines[0],one=items[0].qty==null&&!items[0].unit;S.quote=lines;
    return say(one?`${l.name} ${fm(l.rate)} per ${UL[l.unit]}`:`${fq(l.qty,l.unit)} ${l.name} ${fm(l.amount)} (${fm(l.rate)} per ${UL[l.unit]})`)}
  S.quote=lines;
  say(lines.map(l=>`${l.name} ${fm(l.amount)}`).join(', ')+`, total ${fm(Math.round(lines.reduce((a,l)=>a+l.amount,0)))}`,[[t('Iska bill banao','Make this a bill'),'#bill',1]])}
function addToBill(lines){for(const l of lines){const e=S.bill.find(x=>x.id===l.id);if(e){e.qty=Math.round((e.qty+l.qty)*1000)/1000;e.amount=Math.round(e.qty*e.rate*100)/100}else S.bill.push({...l})}renderBill()}

function startAdd(toks,R,left){const it=R.items[0];const a={type:'add',p:it?it.p:null,name:it?null:left.map(x=>x.raw).join(' ')||null,qty:null,unit:null,cost:null,sell:null,exp:it?null:undefined};
  const nr=(i,set,d)=>[d,2*d].some(o=>toks[i+o]&&inS(set,toks[i+o]));
  const src=it||R.loose;let first=true;
  toks.forEach((x,i)=>{if(x.num===undefined)return;
    const isQ=first&&toks[i+1]&&toks[i+1].unit,sl=d=>nr(i,W.SELLP,d)||nr(i,W.SELL,d);
    if(!isQ&&nr(i,W.COST,1))a.cost=x.num;else if(!isQ&&sl(1))a.sell=x.num;else if(!isQ&&nr(i,W.COST,-1))a.cost=x.num;else if(!isQ&&sl(-1))a.sell=x.num;
    else if(first){a.qty=x.num;a.unit=(toks[i+1]&&toks[i+1].unit)||(src&&src.unit)||null}first=false});
  S.pending=a;advanceAdd()}
function advanceAdd(){const a=S.pending;
  if(!a.p&&!a.name){a.step='name';return say(t('Kaunsa product?','Which product?'))}
  if(a.qty==null){a.step='qty';return say(a.p?t(`${a.p.name} already hai, ${fm(a.p.sell)} per ${UL[a.p.unit]}. Kitna aaya?`,`${a.p.name} exists at ${fm(a.p.sell)} per ${UL[a.p.unit]}. How much came in?`):t('Kitna aaya? (jaise 20 litre)','How much? (e.g. 20 litre)'))}
  if(!a.p&&a.cost==null&&canCost()){a.step='cost';return say(t('Kharid ka rate kya hai?','Cost price?'))}
  if(a.sell==null){if(a.p){a.step='sellkeep';return say(t(`Selling price ${fm(a.p.sell)} hi rahega?`,`Keep the selling price at ${fm(a.p.sell)}?`),YN())}a.step='sell';return say(t('Bechne ka rate?','Selling price?'))}
  if(a.exp===undefined){a.step='exp';return say(t('Expiry date batani hai? (jaise 14 Oct, ya nahi)','Expiry date? (e.g. 14 Oct, or no)'),[[t('Nahi','No'),'nahi']])}
  a.step='confirm';const nm=a.p?a.p.name:a.name,u=a.p?a.p.unit:baseOf(a.unit),q=a.p?toBase(a.qty,a.unit,a.p):toBase(a.qty,a.unit,{unit:u});
  if(q==null){a.qty=null;return advanceAdd()}a.q=q;a.u=u;
  const warn=[a.cost!=null&&a.sell<a.cost?t('Bechne ka rate kharid se kam hai.','The selling price is below the cost price.'):'',a.p&&a.p.sell>0&&(a.sell>a.p.sell*3||a.sell<a.p.sell/3)?t('Rate mein bahut bada badlav hai.','That is a very big price change.'):'',q>=1000||(a.p&&a.p.qty>0&&q>a.p.qty*20&&q>=100)?t('Quantity bahut zyada lag rahi hai.','That quantity looks very large.'):''].filter(Boolean).join(' ');
  const sp=(warn?t('Dhyan do: ','Careful: ')+warn+' ':'')+`${nm}, ${fq(q,u)}, selling ${fm(a.sell)}${a.exp?', expiry '+a.exp:''}. ${t('Save karun?','Save it?')}`;
  say(sp+($('costOn').checked&&a.cost!=null?`\n(cost ${fm(a.cost)})`:''),YN(),sp)}
function parseDate(text){const iso=text.match(/\d{4}-\d{2}-\d{2}/);if(iso)return iso[0];
  const m=text.toLowerCase().match(/(\d{1,2})\s*([a-z]{3})/);if(!m)return null;const mi='janfebmaraprmayjunjulaugsepoctnovdec'.indexOf(m[2])/3;if(mi<0||mi%1)return null;
  const now=new Date();let y=now.getFullYear();if(new Date(y,mi,+m[1]+1)<now)y++;return `${y}-${String(mi+1).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`}
function pendingStep(toks,text,has){const a=S.pending,num=(toks.find(x=>x.num!==undefined)||{}).num,yes=has(W.YES),no=has(W.NO);
  if(toks.some(x=>x.k2==='cancel')){S.pending=null;say(t('Theek hai, cancel.','Okay, cancelled.'));return true}
  if(a.type==='confirm'){if(yes){S.pending=null;a.run();return true}if(no){S.pending=null;say(t('Theek hai, kuch save nahi kiya.','Okay, nothing saved.'));return true}S.pending=null;return false}
  switch(a.step){
    case'name':a.name=text;break;
    case'qty':if(num===undefined){say(t('Number batao, jaise 10 litre.','Give a number, e.g. 10 litre.'));return true}a.qty=num;a.unit=(toks.find(x=>x.unit)||{}).unit||null;break;
    case'cost':if(num===undefined){say(t('Rate number mein batao.','Give the price as a number.'));return true}a.cost=num;break;
    case'sell':if(num===undefined){say(t('Rate number mein batao.','Give the price as a number.'));return true}a.sell=num;break;
    case'sellkeep':if(num!==undefined)a.sell=num;else if(yes)a.sell=a.p.sell;else{a.step='sell';say(t('Naya selling rate?','New selling price?'));return true}break;
    case'exp':if(no)a.exp=null;else{const d=parseDate(text);if(!d){say(t('Date samajh nahi aayi. "14 Oct" jaise bolo, ya "nahi".','I could not read that date. Say it like "14 Oct", or "no".'));return true}a.exp=d}break;
    case'confirm':S.pending=null;if(!yes){say(t('Theek hai, kuch save nahi kiya.','Okay, nothing saved.'));return true}
      if(a.p){const p=S.products.find(x=>x.id===a.p.id)||a.p,n={...p,qty:Math.round((p.qty+a.q)*1000)/1000,sell:a.sell};if(a.exp)n.expiry=a.exp;
        if(a.sell!==p.sell)n.history=[...(p.history||[]),{from:p.sell,to:a.sell,at:Date.now()}];saveProduct(n,'restock');say(t(`${p.name} ab ${fq(n.qty,n.unit)} hai.`,`${p.name} is now ${fq(n.qty,n.unit)}.`))}
      else{saveProduct({id:nid('p'),name:a.name,names:[],unit:a.u,qty:a.q,cost:a.cost,sell:a.sell,low:0,expiry:a.exp||''});say(t(`${a.name} jud gaya. Stock tab mein aur naam jod sakte ho.`,`${a.name} added. You can add more names in the Stock tab.`))}
      return true}
  advanceAdd();return true}

const billTotal=()=>Math.round(S.bill.reduce((a,l)=>a+l.amount,0));
const short=lines=>lines.filter(l=>{const p=S.products.find(x=>x.id===l.id);return p&&l.qty>p.qty}).map(l=>{const p=S.products.find(x=>x.id===l.id);return t(`${p.name} sirf ${fq(p.qty,p.unit)} bacha hai`,`only ${fq(p.qty,p.unit)} of ${p.name} left`)}).join(', ');
function confirmBill(force){if(!S.bill.length)return say(t('Bill khali hai.','The bill is empty.'));
  const sh=short(S.bill);if(sh&&force!==true)return say(t(`Ruko: ${sh}. Phir bhi bechna hai?`,`Wait: ${sh}. Sell anyway?`),[[t('Haan, becho','Yes, sell'),'#forcebill',1],[t('Nahi','No'),'nahi']]);
  const tot=recordSale(S.bill);S.bill=[];renderBill();say(t(`Bill pakka, total ${fm(tot)}. Stock kam kar diya.`,`Bill confirmed, total ${fm(tot)}. Stock lowered.`))}
const daysTo=d=>Math.ceil((new Date(d)-Date.now())/864e5);
function expiryList(){const l=S.products.filter(p=>p.expiry&&daysTo(p.expiry)<=7);
  say(l.length?l.map(p=>`${p.name}: ${daysTo(p.expiry)<0?t('expire ho gaya','expired'):p.expiry}`).join('\n'):t('Is hafte kuch expire nahi ho raha.','Nothing expires this week.'))}

/* ---------- rendering ---------- */
function renderBill(){const b=$('bill');b.hidden=!S.bill.length;$('billEmpty').hidden=!!S.bill.length;if(!S.bill.length)return;
  const txt=S.bill.map(l=>`${l.name} ${fq(l.qty,l.unit)} = ${fm(l.amount)}`).join('\n')+`\nTotal ${fm(billTotal())}`;
  b.innerHTML=`<h2>Bill</h2><table><tbody>${S.bill.map(l=>`<tr><td>${esc(l.name)}</td><td class="n">${fq(l.qty,l.unit)}</td><td class="n">${fm(l.rate)}/${UL[l.unit]}</td><td class="n">${fm(l.amount)}</td><td><button type="button" data-rm="${esc(l.id)}" aria-label="Remove ${esc(l.name)}">×</button></td></tr>`).join('')}</tbody>
  <tfoot><tr><td colspan="3">Total</td><td class="n">${fm(billTotal())}</td><td></td></tr></tfoot></table>
  <div class="row" style="margin-top:8px"><button class="btn go" id="b-ok">Confirm sale</button><button class="btn" id="b-clear">Clear</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">WhatsApp</a></div>`;
  b.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{S.bill=S.bill.filter(l=>l.id!==x.dataset.rm);renderBill()});$('b-ok').onclick=confirmBill;$('b-clear').onclick=()=>{S.bill=[];renderBill()}}
function renderStock(){const cost=$('costOn').checked,ps=[...S.products].sort((a,b)=>a.name.localeCompare(b.name));
  const low=ps.filter(p=>p.low&&p.qty<=p.low).length,exp=ps.filter(p=>p.expiry&&daysTo(p.expiry)<=7).length;
  $('alerts').textContent=[low&&low+' low on stock',exp&&exp+' expiring within a week'].filter(Boolean).join(' · ');
  $('stockList').innerHTML=ps.length?ps.map(p=>`<button class="item" data-id="${esc(p.id)}"><span><b>${esc(p.name)}</b>${p.low&&p.qty<=p.low?'<span class="pill">Low</span>':''}${p.expiry&&daysTo(p.expiry)<=7?`<span class="pill">${daysTo(p.expiry)<0?'Expired':'Expires '+new Date(p.expiry).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span>`:''}</span>
   <span class="p">${fm(p.sell)}/${UL[p.unit]}</span><small>${esc((p.names||[]).join(', '))}</small><span class="p" style="font-weight:400">${fq(p.qty,p.unit)}${cost&&p.cost!=null?' · cost '+fm(p.cost):''}</span></button>`).join('')
   :'<p class="empty">No products yet. Tap Add product, or tell the assistant "cheeni add karo".</p>'}
function renderSales(){const today=new Date().toDateString(),tt=S.sales.filter(s=>new Date(s.at).toDateString()===today).reduce((a,s)=>a+s.total,0);
  $('salesHead').textContent=`Today's sales: ${fm(tt)}`;
  $('salesList').innerHTML=S.sales.length?S.sales.map(s=>`<div class="item"><span>${esc(s.items.map(i=>fq(i.qty,i.unit)+' '+i.name).join(', '))}</span><span class="p">${fm(s.total)}</span><small>${new Date(s.at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div>`).join(''):'<p class="empty">No sales yet today.</p>'}
function renderQuick(){const el=$('quick');el.innerHTML='';[...S.products].sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent='+ '+p.name;
  b.onclick=()=>{addToBill([{id:p.id,name:p.name,qty:1,unit:p.unit,rate:p.sell,amount:p.sell}]);$('sellSay').textContent=`${p.name} +1 ${UL[p.unit]}. Total ${fm(billTotal())}`};el.append(b)})}
function renderAll(){renderStock();renderSales();renderQuick()}

function openEdit(p){S.editing=p?p.id:null;$('edit').hidden=false;$('f-cost-l').hidden=!$('costOn').checked;$('f-del').hidden=!p;p=p||{};
  $('f-name').value=p.name||'';$('f-names').value=(p.names||[]).join(', ');$('f-unit').value=p.unit||'kg';$('f-qty').value=p.qty??'';$('f-sell').value=p.sell??'';$('f-cost').value=p.cost??'';$('f-low').value=p.low||'';$('f-exp').value=p.expiry||'';$('f-name').focus()}
$('edit').onsubmit=e=>{e.preventDefault();const old=S.products.find(p=>p.id===S.editing)||{},n=id=>parseFloat($(id).value)||0,sell=n('f-sell');
  if(!old.id){const nk=key2($('f-name').value),dup=S.products.find(x=>[x.name,...(x.names||[])].some(n=>key2(n)===nk));
    if(dup){openEdit(dup);$('alerts').textContent=`"${dup.name}" already exists. Edit it here instead of adding it again.`;return}}
  const p={...old,id:old.id||nid('p'),name:$('f-name').value.trim(),names:$('f-names').value.split(',').map(s=>s.trim()).filter(Boolean),unit:$('f-unit').value,qty:n('f-qty'),sell,low:n('f-low'),expiry:$('f-exp').value};
  if($('costOn').checked)p.cost=n('f-cost');else if(p.cost===undefined)p.cost=null;
  if(old.id&&old.sell!==sell)p.history=[...(old.history||[]),{from:old.sell,to:sell,at:Date.now()}];
  saveProduct(p);$('edit').hidden=true};
$('f-cancel').onclick=()=>$('edit').hidden=true;
$('f-del').onclick=()=>{if($('f-del').dataset.sure){deleteProduct(S.editing);$('edit').hidden=true;delete $('f-del').dataset.sure;$('f-del').textContent='Delete'}else{$('f-del').dataset.sure=1;$('f-del').textContent='Tap again to delete'}};
$('newBtn').onclick=()=>openEdit(null);
$('stockList').onclick=e=>{const b=e.target.closest('.item');if(b)openEdit(S.products.find(p=>p.id===b.dataset.id))};
$('costOn').onchange=()=>{try{localStorage.setItem('cost',$('costOn').checked?1:'')}catch(e){}renderStock();$('f-cost-l').hidden=!$('costOn').checked};
$('speakOn').onchange=()=>{try{localStorage.setItem('speak',$('speakOn').checked?1:'')}catch(e){}
  if($('speakOn').checked)speak('Awaaz chalu hai');else{$('speakNote').textContent='';try{speechSynthesis.cancel()}catch(e){}}};
try{$('costOn').checked=!!localStorage.getItem('cost');$('speakOn').checked=!!localStorage.getItem('speak')}catch(e){}
let mode='talk';
/* Ask and Sell share one mic panel; it moves to whichever of the two tabs is open. */
function showTab(name){document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===name));
  ['talk','stock','sales','shop'].forEach(n=>$('pane-'+n).hidden=n!==name);
  if(name==='talk'||name==='sales'){mode=name;$('pane-'+name).append($('panel'));setLang(S.lang,true)}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
/* Mic button: uses the browser's speech recognition where the page is allowed the microphone; otherwise opens the keyboard so its mic key can be used. */
let rec=null,listening=false;
function micFallback(why){$('speakNote').textContent=why+' Tap the mic key on your keyboard instead, then Send.';$('say').focus()}
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(listening&&rec){try{rec.stop()}catch(e){}return}
  if(!SR)return micFallback('This browser has no built-in voice typing.');
  try{rec=new SR();rec.lang=S.lang==='en'?'en-IN':'hi-IN';rec.interimResults=true;rec.maxAlternatives=1;let fin='',got=false;
    rec.onstart=()=>{listening=true;$('mic').classList.add('on');$('speakNote').textContent='';$('micLabel').textContent=t('Sun raha hoon…','Listening…')};
    rec.onresult=e=>{got=true;let t='';for(const r of e.results){t+=r[0].transcript;if(r.isFinal)fin=t}$('say').value=t};
    rec.onerror=e=>{if(e.error==='no-speech')$('speakNote').textContent=t('Kuch sunai nahi diya. Dobara mic dabao.','I did not hear anything. Tap the mic again.');
      else if(e.error!=='aborted')micFallback(e.error==='not-allowed'||e.error==='service-not-allowed'?'The microphone is blocked for this page.':'Voice typing failed ('+e.error+').')};
    rec.onend=()=>{listening=false;$('mic').classList.remove('on');$('micLabel').textContent=t('Tap karke bolo','Tap and speak');
      const v=(fin||(got?$('say').value:'')).trim();if(v){$('say').value='';handle(v)}};
    rec.start()}catch(e){micFallback('The microphone could not start.')}};
$('composer').onsubmit=e=>{e.preventDefault();const v=$('say').value;$('say').value='';handle(v)};

renderAll();
function greet(){say(t('Namaste! Kuch bhi pucho ya batao.','Hello! Ask or tell me anything about the shop.'));const c=S.lang==='en'?
  [['Price of milk?','price of milk'],['1 litre milk and 2 kg sugar','1 litre milk and 2 kg sugar total'],['How much sugar is left?','how much sugar is left'],['Add ragi','add ragi']]:
  [['Dudh kitne ka hai?','dudh kitne ka hai?'],['1 litre milk aur 2 kilo sugar','1 litre milk aur 2 kilo sugar ka kitna hua?'],['Cheeni kitni bachi hai?','cheeni kitni bachi hai?'],['Ragi add karo','ragi add karo']];
  const el=$('tips');el.innerHTML='';c.forEach(([l,sd])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=l;b.onclick=()=>handle(sd);el.append(b)})}
/* The language switch sets what the mic listens for, the reply language and the voice. */
function setLang(l,quiet){S.lang=l;try{localStorage.setItem('lang',l)}catch(e){}
  $('lang-hi').setAttribute('aria-pressed',l==='hi');$('lang-en').setAttribute('aria-pressed',l==='en');
  $('micLabel').textContent=t('Tap karke bolo','Tap and speak');$('say').placeholder=mode==='sales'?t('Ya likho: 2 kilo cheeni, 1 Parle-G','Or type: 2 kg sugar, 1 Parle-G'):t('Ya yahan likho: 2 litre dudh kitne ka hai?','Or type here: price of 2 litre milk');
  $('billEmpty').textContent=t('Bill khali hai. Mic dabao aur bolo: “2 kilo cheeni, 1 packet Parle-G”, ya neeche se item chuno.','The bill is empty. Tap the mic and say “2 kg sugar, 1 packet Parle-G”, or pick items below.');
  if(listening&&rec){try{rec.abort()}catch(e){}}if(!quiet)greet()}
$('lang-hi').onclick=()=>setLang('hi');$('lang-en').onclick=()=>setLang('en');
let L0='hi';try{L0=localStorage.getItem('lang')||'hi'}catch(e){}
setLang(L0,true);greet();
(async()=>{const c=window.claude;
  try{db=c?await c.use('db'):null}catch(e){db=null}
  try{sample=c?await c.use('sample'):null}catch(e){sample=null}
  if(!db){let ok=false;try{const d=JSON.parse(localStorage.getItem('shop')||'null');if(d){S.products=d.products||[];S.sales=d.sales||[]}else if(window.SEED)S.products=window.SEED;localStorage.setItem('shop-ok','1');ok=true}catch(e){}
    renderAll();$('status').textContent=ok?'Saved on this device':'Changes are not saved in this browser';
    if(location.protocol.startsWith('http')&&!c){$('shopTab').hidden=false;renderShop();cloudInit().catch(e=>{$('shopMsg').textContent='Cloud is not reachable: '+(e.message||e)})}
    return}
  $('status').textContent='Saved to your shop';
  const fail=e=>{$('status').textContent='Offline: '+(e.message||e.code)};
  db.collection('products').onSnapshot(s=>{S.products=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},fail);
  db.collection('sales').orderBy('at','desc').limit(100).onSnapshot(s=>{S.sales=s.docs.map(d=>d.data());renderSales()},fail);
})();
</script>

</body></html>
